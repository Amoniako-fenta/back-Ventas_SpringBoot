name: Deploy Backend Ventas

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: backend-ventas
  ECS_CLUSTER: cluster-proyecto-semestral
  ECS_SERVICE: backend-ventas-service-f344gryz
  ECS_TASK_DEFINITION: backend-ventas

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t backend-ventas .

      - name: Tag Docker image
        run: |
          docker tag backend-ventas:latest \
          108327187275.dkr.ecr.us-east-1.amazonaws.com/backend-ventas:latest

      - name: Push Docker image
        run: |
          docker push \
          108327187275.dkr.ecr.us-east-1.amazonaws.com/backend-ventas:latest

      - name: Force ECS Deployment
        run: |
          aws ecs update-service \
            --cluster cluster-proyecto-semestral \
            --service backend-ventas-service-f344gryz \
            --force-new-deployment